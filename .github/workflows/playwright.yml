name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-report.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Prepare live report
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p playwright-report
          if [ ! -f playwright-report/index.html ]; then
            echo "<h1>Playwright report was not generated</h1>" > playwright-report/index.html
          fi

      - name: Configure GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload report for GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

      - name: Publish live HTML report
        if: always() && github.event_name != 'pull_request'
        id: deploy-report
        uses: actions/deploy-pages@v5

      - name: Show live report link
        if: always() && github.event_name != 'pull_request'
        run: |
          echo "### Playwright HTML Report" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.deploy-report.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
